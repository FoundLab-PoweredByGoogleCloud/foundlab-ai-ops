version: 2

# Provider-neutral compute classes. Provider/model IDs are deployment-time mappings.
classes:
  economy:
    intent: bounded_repetitive_high_volume
    default_reasoning: low
  balanced:
    intent: exploration_routine_engineering
    default_reasoning: low
  professional:
    intent: complex_professional_work
    default_reasoning: medium
  frontier:
    intent: hardest_unfamiliar_or_escalated_reasoning
    default_reasoning: low

defaults:
  class: balanced
  fast_mode: false
  max_parallel_agents: 2

legacy_openai_mapping:
  luna: economy
  terra: balanced
  sol: professional
  astra: frontier

escalation:
  order: [balanced, professional, frontier]
  rules:
    - escalate_for_reasoning_difficulty
    - do_not_escalate_for_missing_context
    - do_not_escalate_for_missing_permissions
    - do_not_escalate_for_missing_evidence
