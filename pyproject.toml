[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "foundlab-ai-ops"
version = "0.1.0"
description = "Executable governance and operational control plane for human + agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FoundLab" }]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "rich>=13.8,<14",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "jsonschema>=4.23,<5",
]

[project.scripts]
flops = "foundlab_ai_ops.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/foundlab_ai_ops"]
